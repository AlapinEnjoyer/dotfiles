general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid starting multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session    # lock before suspend.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'  # restore the display after sleep.
}

listener {
    timeout = 900                                # 15min
    on-timeout = brightnessctl -s set 10         # set monitor backlight to minimum, avoid 0 on OLED monitor.
    on-resume = brightnessctl -r                 # monitor backlight restore.
}

listener {
    timeout = 1200                                 # 20min
    on-timeout = loginctl lock-session            # lock screen when timeout has passed
}

listener {
    timeout = 1500                                                     # 25min
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'     # screen off when timeout has passed
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })' && brightnessctl -r
}

listener {
    timeout = 10800                                # 3 hours
    on-timeout = systemctl suspend                # suspend pc
}
